name: Restore reasoning apostrophe support

on:
  push:
    branches:
      - repair/standalone-encoding-pass

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore curly apostrophe recognition
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('reasoning/reasoning-capture-core.js')
          text = path.read_text(encoding='utf-8')
          damaged = r"[\p{L}\p{M}''\-]*"
          repaired = r"[\p{L}\p{M}'’\-]*"
          count = text.count(damaged)
          if count:
              if count != 2:
                  raise SystemExit(f'Expected two damaged patterns, found {count}')
              path.write_text(text.replace(damaged, repaired), encoding='utf-8', newline='\n')
          elif text.count(repaired) != 2:
              raise SystemExit('Reasoning apostrophe patterns are not in the expected state')
          PY

      - name: Validate repair
        run: |
          node --check reasoning/reasoning-capture-core.js
          node --test tests/*.test.js
          git diff --check

      - name: Commit repair
        run: |
          if git diff --quiet -- reasoning/reasoning-capture-core.js; then
            echo 'Reasoning apostrophe support is already correct.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reasoning/reasoning-capture-core.js
          git commit -m 'Restore curly apostrophe reasoning support'
          git push origin HEAD:repair/standalone-encoding-pass
